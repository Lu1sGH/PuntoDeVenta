<section class="max-w-2xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
  <div class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-7 shadow-xs">
    <header class="mb-6">
      <h1 class="text-xl sm:text-2xl font-bold text-slate-900 m-0">Agregar producto</h1>
      <p class="text-sm text-slate-500 m-0 mt-1">
        Registra un nuevo artículo en el inventario.
      </p>
    </header>

    @if (statusMessage(); as status) {
      <div
        class="px-4 py-3 rounded-xl mb-5 text-sm font-medium border"
        [class.bg-green-50]="status.type === 'success'"
        [class.text-green-800]="status.type === 'success'"
        [class.border-green-200]="status.type === 'success'"
        [class.bg-red-50]="status.type === 'error'"
        [class.text-red-800]="status.type === 'error'"
        [class.border-red-200]="status.type === 'error'"
        role="status"
      >
        {{ status.text }}
      </div>
    }

    <form class="space-y-5" (ngSubmit)="onSubmit()" novalidate>
      <div>
        <label for="product-name" class="block text-sm font-semibold text-slate-800 mb-1.5">
          Nombre del producto
        </label>
        <input
          id="product-name"
          name="name"
          type="text"
          placeholder="Ej. Café Americano 12oz"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm sm:text-base text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          required
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="product-quantity" class="block text-sm font-semibold text-slate-800 mb-1.5">
            Cantidad
          </label>
          <input
            id="product-quantity"
            name="quantity"
            type="number"
            min="0"
            step="1"
            placeholder="0"
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm sm:text-base text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            [ngModel]="quantity()"
            (ngModelChange)="quantity.set($event)"
            required
          />
        </div>

        <div>
          <label for="product-price" class="block text-sm font-semibold text-slate-800 mb-1.5">
            Precio (MXN)
          </label>
          <div class="relative flex items-center">
            <span class="absolute left-3.5 text-slate-500 font-semibold pointer-events-none">$</span>
            <input
              id="product-price"
              name="priceMxn"
              type="number"
              min="0"
              step="0.01"
              placeholder="0.00"
              class="w-full pl-8 pr-14 py-2.5 border border-slate-300 rounded-xl text-sm sm:text-base text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              [ngModel]="priceMxn()"
              (ngModelChange)="priceMxn.set($event)"
              required
            />
            <span class="absolute right-3.5 text-xs font-semibold text-slate-500 pointer-events-none">
              MXN
            </span>
          </div>
        </div>
      </div>

      <div>
        <label for="product-description" class="block text-sm font-semibold text-slate-800 mb-1.5">
          Descripción breve
        </label>
        <textarea
          id="product-description"
          name="description"
          rows="3"
          maxlength="280"
          placeholder="Descripción corta del producto..."
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm sm:text-base text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          [ngModel]="description()"
          (ngModelChange)="description.set($event)"
        ></textarea>
      </div>

      <div>
        <label for="product-photo" class="block text-sm font-semibold text-slate-800 mb-1.5">
          Foto
        </label>
        <input
          #photoInput
          id="product-photo"
          name="photo"
          type="file"
          accept="image/*"
          class="w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs sm:file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
          (change)="onPhotoSelected($event)"
        />

        @if (photoPreview(); as preview) {
          <div class="mt-3 w-36 h-36 rounded-xl overflow-hidden border border-slate-200 bg-slate-100 shadow-xs">
            <img [src]="preview" alt="Vista previa del producto" class="w-full h-full object-cover block" />
          </div>
        }
      </div>

      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 pt-4 border-t border-slate-200">
        <button
          type="submit"
          class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm sm:text-base font-semibold transition-colors cursor-pointer disabled:opacity-60"
          [disabled]="saving()"
        >
          {{ saving() ? 'Guardando...' : 'Guardar' }}
        </button>
        <button
          type="button"
          class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 text-sm sm:text-base font-semibold transition-colors cursor-pointer disabled:opacity-60"
          [disabled]="saving()"
          (click)="clearForm()"
        >
          Limpiar formulario
        </button>
      </div>
    </form>
  </div>
</section>
