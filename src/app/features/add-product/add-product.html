<section class="add-product-container">
  <div class="form-card">
    <header class="form-header">
      <h1>Agregar producto</h1>
      <p>Registra un nuevo artículo en el inventario.</p>
    </header>

    @if (statusMessage(); as status) {
      <div
        class="alert"
        [class.alert-success]="status.type === 'success'"
        [class.alert-error]="status.type === 'error'"
        role="status"
      >
        {{ status.text }}
      </div>
    }

    <form class="product-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="product-name">Nombre del producto</label>
        <input
          id="product-name"
          name="name"
          type="text"
          placeholder="Ej. Café Americano 12oz"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          required
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="product-quantity">Cantidad</label>
          <input
            id="product-quantity"
            name="quantity"
            type="number"
            min="0"
            step="1"
            placeholder="0"
            [ngModel]="quantity()"
            (ngModelChange)="quantity.set($event)"
            required
          />
        </div>

        <div class="form-group">
          <label for="product-price">Precio (MXN)</label>
          <div class="price-input-wrapper">
            <span class="currency-prefix">$</span>
            <input
              id="product-price"
              name="priceMxn"
              type="number"
              min="0"
              step="0.01"
              placeholder="0.00"
              [ngModel]="priceMxn()"
              (ngModelChange)="priceMxn.set($event)"
              required
            />
            <span class="currency-suffix">MXN</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="product-description">Descripción breve</label>
        <textarea
          id="product-description"
          name="description"
          rows="3"
          maxlength="280"
          placeholder="Descripción corta del producto..."
          [ngModel]="description()"
          (ngModelChange)="description.set($event)"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="product-photo">Foto</label>
        <input
          #photoInput
          id="product-photo"
          name="photo"
          type="file"
          accept="image/*"
          (change)="onPhotoSelected($event)"
        />

        @if (photoPreview(); as preview) {
          <div class="photo-preview">
            <img [src]="preview" alt="Vista previa del producto" />
          </div>
        }
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="saving()">
          {{ saving() ? 'Guardando...' : 'Guardar' }}
        </button>
        <button
          type="button"
          class="btn-secondary"
          [disabled]="saving()"
          (click)="clearForm()"
        >
          Limpiar formulario
        </button>
      </div>
    </form>
  </div>
</section>
