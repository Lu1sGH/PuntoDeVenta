<header class="navbar-header">
  <nav class="navbar" aria-label="Navegación principal">
    <ul class="nav-links">
      <li>
        <button
          type="button"
          class="nav-item"
          [class.active]="activeOption() === 'productos'"
          (click)="selectOption('productos')"
        >
          Productos disponibles
        </button>
      </li>
      <li>
        <button
          type="button"
          class="nav-item"
          [class.active]="activeOption() === 'agregar'"
          (click)="selectOption('agregar')"
        >
          Agregar productos
        </button>
      </li>
      <li>
        <button
          type="button"
          class="nav-item"
          [class.active]="activeOption() === 'venta'"
          (click)="selectOption('venta')"
        >
          Realizar venta
        </button>
      </li>
    </ul>

    <button
      type="button"
      class="nav-settings-btn"
      [class.active]="activeOption() === 'configuraciones'"
      (click)="selectOption('configuraciones')"
      aria-label="Configuraciones"
      title="Configuraciones"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
        />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </button>
  </nav>
</header>

<main class="main-content">
  @if (activeOption() === 'productos') {
    <app-available-products />
  } @else if (activeOption() === 'agregar') {
    <app-add-product />
  } @else if (activeOption() === 'configuraciones') {
    <app-settings />
  }
  <router-outlet />
</main>
